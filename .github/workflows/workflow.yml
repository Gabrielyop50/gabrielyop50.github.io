name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A7E355: ${{ secrets.A7E355 }}
          B5180E: ${{ secrets.B5180E }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A7E355', '')
          k2 = os.environ.get('B5180E', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- 6554d5a3869fc012c13615cbee5008f25cd55390301a -->', k1) if k1 else txt
          out = out.replace('<!-- a7014faa76e280d465b285cef789944eb0e367 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
